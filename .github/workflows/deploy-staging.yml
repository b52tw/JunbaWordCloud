name: Deploy JunbaWordCloud Staging

on:
  workflow_dispatch:
  push:
    branches:
      - fix/topic-archive-guardrails
    paths:
      - "online/**"
      - "web/**"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-staging.yml"

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: fix/topic-archive-guardrails

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests and syntax checks
        run: |
          node --check online/worker.mjs
          node --check online/core.mjs
          node --check web/app.js
          npm run check

      - name: Deploy isolated staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SETUP_KEY: ${{ secrets.STAGING_SETUP_KEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing GitHub Actions secret CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$SETUP_KEY" || (echo "Missing GitHub Actions secret STAGING_SETUP_KEY" && exit 1)
          test "${#SETUP_KEY}" -ge 24 || (echo "STAGING_SETUP_KEY must be at least 24 characters" && exit 1)
          printf '%s' "$SETUP_KEY" | npx wrangler secret put SETUP_KEY --name junba-wordcloud-staging
          npx wrangler deploy --config wrangler.jsonc
